
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "google-news-mcp"
version = "0.1.0"
description = "An open-source MCP server for Google News."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0,<3.0",
    "httpx>=0.28,<1.0",
    "feedparser>=6.0,<7.0",
    "pydantic>=2.12,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.14",
]
ai = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/google_news_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
